<rz-slide-shell [meta]="meta" layout="full">
  <div class="intro">
    <div class="center">
      <img class="logo a-fade" [src]="logoUrl" alt="" [style.animation-delay.ms]="cue('title')" />
      <h1 class="headline a-fade-up" [style.animation-delay.ms]="cue('title')">{{ s().title }}</h1>
      <div class="pill a-pop" [style.animation-delay.ms]="cue('pill')">{{ s().pill }}</div>
      <p class="subtitle a-fade-up" [style.animation-delay.ms]="cue('subtitle')">{{ s().subtitle }}</p>
    </div>
  </div>
</rz-slide-shell>
